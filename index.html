<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <meta name="description" content="Controle de faltas, conteúdos e tarefas do seu semestre." />
    <title>Meu Semestre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.6 12 3.6l8.5 7v8.6a1.3 1.3 0 0 1-1.3 1.3H15v-5.8H9v5.8H4.8a1.3 1.3 0 0 1-1.3-1.3z"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7.1C10.3 5.6 7.4 4.7 4 4.7v12.2c3.4 0 6.3.9 8 2.4 1.7-1.5 4.6-2.4 8-2.4V4.7c-3.4 0-6.3.9-8 2.4Z"/><path d="M12 7.1v12.2"/></symbol>
      <symbol id="i-absence" viewBox="0 0 24 24"><rect x="3.4" y="4" width="17.2" height="16" rx="2.8"/><path d="M3.4 9h17.2"/><path d="M9.4 12.4l5.2 5.2M14.6 12.4l-5.2 5.2"/></symbol>
      <symbol id="i-notes" viewBox="0 0 24 24"><path d="M5.4 3.2h8.4l4.8 4.8v12.8H5.4z"/><path d="M13.8 3.2v4.8h4.8"/><path d="M8.8 13h6.4M8.8 16.6h4.2"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><path d="M20.6 11.4v7.4a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2V5.6a2 2 0 0 1 2-2h9.8"/><path d="M8.8 11.4 12 14.6l8.2-8.2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.2v13.6M5.2 12h13.6"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.4v11.8M7.4 10.8 12 15.4l4.6-4.6M4.4 20.6h15.2"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20.6V8.8M7.4 13.4 12 8.8l4.6 4.6M4.4 3.4h15.2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.2 6.6h15.6M9.4 6.6V3.8h5.2v2.8M6.4 6.6l1 13.6h9.2l1-13.6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4.2L20.2 8 16 3.8 4 15.8z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 6.4l11.2 11.2M17.6 6.4 6.4 17.6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8 9.6 17.4 19 7.2"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.8"/><path d="M12 6.8V12l3.4 2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.6 21.4 20H2.6z"/><path d="M12 9.6v4.4M12 17.2h.01"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3.4 13.2h5l1.7 2.6h3.8l1.7-2.6h5"/><path d="M5.6 4.6h12.8l2.2 8.6v6.2H3.4v-6.2z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3.2l2 6.2 6.2 2-6.2 2-2 6.2-2-6.2-6.2-2 6.2-2z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20.4 11.2 12 19.6a5.4 5.4 0 0 1-7.6-7.6l8.6-8.6a3.6 3.6 0 0 1 5.1 5.1l-8.6 8.6a1.8 1.8 0 0 1-2.5-2.5l7.8-7.8"/></symbol>
    </svg>

    <div class="shell">
      <header class="topbar">
        <div class="logo logo--sm">
          <span class="logo-mark"></span>
          <span class="logo-text">Meu Semestre</span>
        </div>
        <button class="icon-btn" id="more" aria-label="Mais opções" aria-expanded="false">
          <svg class="ico"><use href="#i-more" /></svg>
        </button>
      </header>

      <aside class="sidebar">
        <div class="logo">
          <span class="logo-mark"></span>
          <span class="logo-text">
            Meu Semestre
            <small>Controle acadêmico</small>
          </span>
        </div>

        <nav id="nav" aria-label="Navegação principal"></nav>

        <div class="spacer"></div>

        <div class="side-foot">
          <button class="ghost" id="export">
            <svg class="ico"><use href="#i-download" /></svg>
            <span>Exportar backup</span>
          </button>
          <button class="ghost" id="import">
            <svg class="ico"><use href="#i-upload" /></svg>
            <span>Importar backup</span>
          </button>
        </div>
        <input type="file" id="file" accept=".json" hidden />
      </aside>

      <main id="main" tabindex="-1"></main>
    </div>

    <div class="sheet-scrim" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-label="Opções">
        <span class="sheet-grip"></span>
        <button class="sheet-item" data-sheet="export">
          <svg class="ico"><use href="#i-download" /></svg>
          <span>Exportar backup</span>
        </button>
        <button class="sheet-item" data-sheet="import">
          <svg class="ico"><use href="#i-upload" /></svg>
          <span>Importar backup</span>
        </button>
      </div>
    </div>

    <div id="toasts" role="status" aria-live="polite"></div>

    <!-- Classic scripts, not ES modules, so the page also works when opened
         straight from disk (file://), where browsers block module loading.
         They share one global scope; keep this order: each file uses the ones above it. -->
    <script src="./modules/state.js" defer></script>
    <script src="./modules/utils.js" defer></script>
    <script src="./modules/files.js" defer></script>
    <script src="./modules/render.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
